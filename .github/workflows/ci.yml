name: ci

on:
  push:
    branches: [main]
  pull_request:

# No AWS credentials in the repository and no deploys from CI. Deployment is a
# documented manual step; a public repo that cannot deploy itself is a feature.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: mvn -B test

      - name: Integration tests (LocalStack via Testcontainers)
        run: mvn -B verify

      - name: Upload handler jar
        uses: actions/upload-artifact@v4
        with:
          name: flowdex-jar
          path: target/flowdex.jar

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
